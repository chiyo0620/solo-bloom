<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Bloom - ゆとり費アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ivory: '#FDFBF7',
            sage: '#9CAF88',
            sageLight: '#C3D0B4',
            textMain: '#4A4A4A',
            ticketBg: '#F4F1EA'
          }
        }
      }
    }
  </style>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .water-fill {
      background: linear-gradient(180deg, #C3D0B4 0%, #9CAF88 100%);
      transition: height 0.3s ease;
    }
    
    .ticket-card {
      position: relative;
      background: #F4F1EA;
      border: 1px solid #E5E0D8;
    }
    .ticket-card::before, .ticket-card::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 16px; height: 16px;
      background-color: #FDFBF7;
      border-radius: 50%;
      transform: translateY(-50%);
      border: 1px solid #E5E0D8;
    }
    .ticket-card::before { left: -9px; border-right-color: transparent; border-bottom-color: transparent; transform: translateY(-50%) rotate(-45deg); }
    .ticket-card::after { right: -9px; border-left-color: transparent; border-top-color: transparent; transform: translateY(-50%) rotate(-45deg); }
  </style>
</head>

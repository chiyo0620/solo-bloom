<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ポケット標本箱 - Pocket Mineral Cabinet</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Swiper.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />

    <style>
        /* ==========================================
           1. BASE STYLES & VARIABLES
           ========================================== */
        :root {
            --wood-dark: #1f1209;
            --wood-mid: #3a2311;
            --brass-light: #e5cc8f;
            --brass-dark: #8c6a21;
            --velvet-center: #114a2a;
            --velvet-edge: #061c0e;
            --parchment: #f4ebdb;
        }

        body {
            font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
            background-color: #0c0704;
            color: #332218;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow: hidden;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ==========================================
           2. TEXTURES (Wood, Brass, Velvet, Parchment)
           ========================================== */
        .wood-body {
            background-color: var(--wood-dark);
            background-image: repeating-linear-gradient(to right, transparent, transparent 40px, rgba(0,0,0,0.1) 40px, rgba(0,0,0,0.1) 80px);
        }

        .drawer-front {
            background: linear-gradient(180deg, #422916 0%, #2e1a0d 100%);
            border: 1px solid #5c3b21;
            border-bottom: 4px solid #140b05;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            transition: transform 0.1s;
        }
        .drawer-front:active { transform: scale(0.98); }

        .brass-plate {
            background: linear-gradient(135deg, var(--brass-light) 0%, var(--brass-dark) 100%);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.5), 0 2px 4px rgba(0,0,0,0.6);
            border: 1px solid #4a3811;
        }

        .velvet-bg {
            background: radial-gradient(circle at 50% 30%, var(--velvet-center) 0%, var(--velvet-edge) 100%);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        .parchment-bg {
            background-color: var(--parchment);
            background-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 50%, rgba(139, 115, 85, 0.1) 100%);
        }

        /* ==========================================
           3. UI ELEMENTS & ANIMATIONS
           ========================================== */
        .story-quote {
            position: relative;
            background: #efe3ce;
            border: 1px solid #dfd1b8;
            border-left: 3px solid #9e7b4f;
        }
        
        .state-pill {
            transition: all 0.2s ease;
        }
        .state-pill.active {
            background-color: #2b4535;
            color: #dceddf;
            border-color: #1e3325;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .fade-in { animation: fadeIn 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .img-crossfade { transition: opacity 0.3s ease-in-out; }

        .swiper { width: 100%; height: 100%; }
        .swiper-slide { height: auto; padding-bottom: 2rem; }
    </style>
</head>
<body class="flex flex-col items-center justify-start sm:p-4 selection:bg-[#a37b45] selection:text-white h-[100dvh]">

    <!-- MAIN APP CONTAINER -->
    <div class="w-full max-w-md h-full flex flex-col relative overflow-hidden sm:rounded-2xl sm:shadow-2xl border-x-0 sm:border-x-4 sm:border-y-4 border-[#2b180d] wood-body">
        
        <!-- HEADER -->
        <header class="w-full px-4 py-3 bg-gradient-to-b from-[#24150b] to-[#120a05] border-b border-[#3b2313] flex items-center justify-between z-40 shrink-0 shadow-lg">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-full border border-[#8c6a21] flex items-center justify-center bg-[#1a0f08]">
                    <i class="fa-solid fa-gem text-[#e5cc8f] text-sm"></i>
                </div>
                <div>
                    <h1 class="text-[#f1e6d4] text-[15px] font-bold tracking-widest">ポケット標本箱</h1>
                    <p class="text-[9px] text-[#9e7b4f] tracking-widest font-['Cinzel']">Mineral Cabinet</p>
                </div>
            </div>
            <button onclick="openModal()" class="text-[#8c6a21] hover:text-[#e5cc8f] text-sm"><i class="fa-solid fa-plus"></i> 追加</button>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 relative overflow-hidden">

            <!-- VIEW 1: CABINET (Home) -->
            <section id="view-cabinet" class="absolute inset-0 p-4 overflow-y-auto no-scrollbar flex flex-col justify-start z-10 space-y-4 pt-6">
                <!-- Drawers injected via JS -->
            </section>

            <!-- VIEW 2: INSIDE DRAWER (Velvet Grid) -->
            <section id="view-drawer" class="absolute inset-0 z-20 flex flex-col velvet-bg hidden slide-up">
                <div class="px-3 py-2.5 bg-[#0b1c11] border-b border-[#1c3a26] flex items-center justify-between shadow-xl shrink-0">
                    <button onclick="closeDrawer()" class="flex items-center space-x-1.5 text-[#a8c6b1] hover:text-white text-xs py-1.5 px-2 rounded active:bg-[#15301e]">
                        <i class="fa-solid fa-chevron-left"></i> <span>標本函へ</span>
                    </button>
                    <h2 id="drawer-title" class="text-sm font-bold text-[#e1ecd6] tracking-wider pr-2"></h2>
                </div>
                <div class="flex-1 p-4 overflow-y-auto no-scrollbar">
                    <div id="drawer-grid" class="grid grid-cols-2 gap-4 pb-20">
                        <!-- Stones injected via JS -->
                    </div>
                </div>
            </section>

            <!-- VIEW 3: ENCYCLOPEDIA CARD MODE (Swiper) -->
            <section id="view-card" class="absolute inset-0 z-30 flex flex-col parchment-bg hidden slide-up">
                <div class="px-3 py-2.5 bg-[#e4d8c2] border-b border-[#c4b59d] flex items-center justify-between shadow-sm shrink-0">
                    <button onclick="closeCard()" class="flex items-center space-x-1.5 text-[#5e452a] text-xs font-bold py-1 px-2 active:bg-[#d5c6ae] rounded">
                        <i class="fa-solid fa-arrow-left"></i> <span>戻る</span>
                    </button>
                    <div class="swiper-pagination-custom text-xs font-['Cinzel'] font-bold text-[#8a6b42]"></div>
                </div>
                <div class="swiper card-swiper flex-1">
                    <div class="swiper-wrapper" id="card-wrapper">
                        <!-- Slides injected via JS -->
                    </div>
                </div>
            </section>
        </main>

        <!-- VIEW 4: ADD/EDIT MODAL -->
        <div id="modal-form" class="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
            <div class="w-full h-[95%] sm:h-auto sm:max-h-[90%] bg-[#1b1009] border-t border-[#4a2e19] sm:border sm:rounded-2xl flex flex-col shadow-2xl slide-up rounded-t-2xl">
                
                <div class="p-4 bg-gradient-to-r from-[#2b190f] to-[#1a0f08] border-b border-[#3b2313] flex items-center justify-between shrink-0 rounded-t-2xl">
                    <div class="flex items-center space-x-2 text-[#e5cc8f]">
                        <i class="fa-solid fa-pen-nib"></i>
                        <h3 id="modal-title" class="text-sm font-bold font-serif tracking-widest">標本登録</h3>
                    </div>
                    <button onclick="closeModal()" class="text-[#8c6a21] hover:text-[#e5cc8f] p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>

                <div class="p-5 flex-1 overflow-y-auto no-scrollbar space-y-5">
                    <!-- AI Parser Block -->
                    <div class="bg-[#120a05] border border-[#3b2313] p-3 rounded-lg space-y-2">
                        <p class="text-xs text-[#a68a68] font-serif flex justify-between items-center">
                            <span><i class="fa-solid fa-wand-magic-sparkles text-[#d4af37]"></i> Gemini解析ペースト</span>
                        </p>
                        <textarea id="ai-text" class="w-full h-20 bg-[#0c0704] border border-[#4a2e19] rounded p-2 text-[#dcd0bc] text-xs font-serif focus:outline-none focus:border-[#8c6a21] resize-none" placeholder="調べたテキストをここにペースト..."></textarea>
                        <button type="button" onclick="parseAIText()" class="w-full py-2 bg-[#2b190f] text-[#e5cc8f] text-xs rounded border border-[#4a2e19] active:bg-[#3b2313]">テキストを解析して自動入力</button>
                    </div>

                    <hr class="border-[#3b2313]">

                    <!-- Form -->
                    <form id="stone-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                        <input type="hidden" id="form-id">
                        
                        <!-- 既存の画像URLを保持するための隠しフィールド -->
                        <input type="hidden" id="existing-img-dry">
                        <input type="hidden" id="existing-img-wet">
                        <input type="hidden" id="existing-img-light">

                        <div class="grid grid-cols-2 gap-3">
                            <div class="col-span-2">
                                <label class="block text-xs font-bold text-[#8c6a21] mb-1">石の名前 <span class="text-red-500">*</span></label>
                                <input type="text" id="form-name" required class="w-full bg-[#0c0704] border border-[#4a2e19] rounded p-2 text-[#dcd0bc] text-sm focus:outline-none focus:border-[#8c6a21]">
                            </div>
                            
                            <div>
                                <label class="block text-xs font-bold text-[#8c6a21] mb-1">分類 (3大グループ) <span class="text-red-500">*</span></label>
                                <select id="form-category" required class="w-full bg-[#0c0704] border border-[#4a2e19] rounded p-2 text-[#dcd0bc] text-sm focus:outline-none focus:border-[#8c6a21]">
                                    <option value="火成岩">火成岩 (Igneous)</option>
                                    <option value="堆積岩">堆積岩 (Sedimentary)</option>
                                    <option value="変成岩">変成岩 (Metamorphic)</option>
                                    <option value="鑑定中">鑑定中 (Unidentified)</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-[#8c6a21] mb-1">採取地</label>
                                <input type="text" id="form-location" class="w-full bg-[#0c0704] border border-[#4a2e19] rounded p-2 text-[#dcd0bc] text-sm focus:outline-none focus:border-[#8c6a21]">
                            </div>

                            <div class="col-span-2 grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-[#8c6a21] mb-1">地質帯 / 構造帯</label>
                                    <input type="text" id="form-band" class="w-full bg-[#0c0704] border border-[#4a2e19] rounded p-2 text-[#dcd0bc] text-sm focus:outline-none focus:border-[#8c6a21]">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-[#8c6a21] mb-1">形成年代 (代/紀)</label>
                                    <input type="text" id="form-era" placeholder="例: 古生代" class="w-full bg-[#0c0704] border border-[#4a2e19] rounded p-2 text-[#dcd0bc] text-sm focus:outline-none focus:border-[#8c6a21]">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-[#8c6a21] mb-1">数値年代</label>
                                    <input type="text" id="form-age" placeholder="例: 約5億年前" class="w-full bg-[#0c0704] border border-[#4a2e19] rounded p-2 text-[#dcd0bc] text-sm focus:outline-none focus:border-[#8c6a21]">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-[#8c6a21] mb-1">構成鉱物</label>
                                    <input type="text" id="form-minerals" class="w-full bg-[#0c0704] border border-[#4a2e19] rounded p-2 text-[#dcd0bc] text-sm focus:outline-none focus:border-[#8c6a21]">
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#8c6a21] mb-1">特徴と見分け方</label>
                            <textarea id="form-features" class="w-full h-16 bg-[#0c0704] border border-[#4a2e19] rounded p-2 text-[#dcd0bc] text-sm focus:outline-none focus:border-[#8c6a21] resize-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-[#8c6a21] mb-1">成因・地質ストーリー</label>
                            <textarea id="form-story" class="w-full h-24 bg-[#0c0704] border border-[#4a2e19] rounded p-2 text-[#dcd0bc] text-sm focus:outline-none focus:border-[#8c6a21] resize-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-[#8c6a21] mb-1">豆知識・コラム</label>
                            <textarea id="form-trivia" class="w-full h-16 bg-[#0c0704] border border-[#4a2e19] rounded p-2 text-[#dcd0bc] text-sm focus:outline-none focus:border-[#8c6a21] resize-none"></textarea>
                        </div>

                        <!-- Image Upload -->
                        <div>
                            <label class="block text-xs font-bold text-[#8c6a21] mb-2"><i class="fa-solid fa-images"></i> 画像 (自動圧縮されてクラウドに保存されます)</label>
                            <div class="space-y-2">
                                <div class="flex items-center space-x-2 bg-[#120a05] border border-[#4a2e19] rounded p-1.5">
                                    <span class="text-xs text-[#a68a68] w-12 text-right">乾き</span>
                                    <input type="file" id="img-file-dry" accept="image/*" class="flex-1 text-[#dcd0bc] text-xs">
                                </div>
                                <div class="flex items-center space-x-2 bg-[#120a05] border border-[#4a2e19] rounded p-1.5">
                                    <span class="text-xs text-[#a68a68] w-12 text-right">濡れ</span>
                                    <input type="file" id="img-file-wet" accept="image/*" class="flex-1 text-[#dcd0bc] text-xs">
                                </div>
                                <div class="flex items-center space-x-2 bg-[#120a05] border border-[#4a2e19] rounded p-1.5">
                                    <span class="text-xs text-[#a68a68] w-12 text-right">透過光</span>
                                    <input type="file" id="img-file-light" accept="image/*" class="flex-1 text-[#dcd0bc] text-xs">
                                </div>
                            </div>
                        </div>

                        <div class="pt-4 flex space-x-3">
                            <button type="button" id="btn-delete" onclick="deleteCurrentStone()" class="hidden px-4 py-3 bg-[#3a1c1c] text-[#ff8888] rounded font-bold shadow-lg border border-[#5a2c2c] active:scale-95">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                            <button type="submit" id="btn-submit" class="flex-1 py-3 bg-gradient-to-r from-[#8c6a21] to-[#5c4515] text-[#f4ebdb] rounded font-bold shadow-lg active:scale-95 border border-[#a37b2d]">
                                保存する
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Swiper.js -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- App Logic with Supabase -->
    <script>
        // ==========================================
        // 1. SUPABASE INITIALIZATION
        // ==========================================
        // ★ここをご自身のURLとキーに書き換えてください★
    const SUPABASE_URL = 'https://mlyqkgnpugvplywdxfnx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1seXFrZ25wdWd2cGx5d2R4Zm54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NDg0NjYsImV4cCI6MjEwODMyNDQ2Nn0.0Gt28lq7-DcOgcvNSHzFUxhM24H0EHJz0ff57eXfCg4';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // DATA MODEL & STATE
        // ==========================================
        const DRAWERS = [
            { id: '火成岩', label: '火成岩', subtitle: 'Igneous Rocks' },
            { id: '堆積岩', label: '堆積岩', subtitle: 'Sedimentary Rocks' },
            { id: '変成岩', label: '変成岩', subtitle: 'Metamorphic Rocks' },
            { id: '鑑定中', label: '鑑定中', subtitle: 'Unidentified' }
        ];

        let stones = [];
        let activeDrawerId = null;
        let activeDrawerStones = [];
        let swiperInstance = null;

        const IMG_TYPES = {
            'dry': { icon: 'fa-sun', label: '乾き' },
            'wet': { icon: 'fa-droplet', label: '濡れ' },
            'light': { icon: 'fa-lightbulb', label: '透過光' }
        };

        // Initialize Data from Supabase
        async function initData() {
            const { data, error } = await supabase
                .from('minerals')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("データの取得に失敗しました", error);
                // エラー時は空配列にしてUIだけ表示する
                stones = [];
            } else {
                // Supabaseから取得したデータをUI用に整形
                stones = data.map(row => {
                    // image_urlに保存されたJSON文字列を配列に戻す
                    let imagesArr = [];
                    if (row.image_url) {
                        try {
                            imagesArr = JSON.parse(row.image_url);
                        } catch (e) {
                            // 旧データで単一URLの場合のフォールバック
                            imagesArr = [{ url: row.image_url, type: 'dry' }];
                        }
                    }
                    
                    return {
                        id: row.id,
                        name: row.name,
                        category: row.category,
                        location: row.location,
                        geologicalBand: row.geologicalBand || '', // テーブルにカラムを追加していない場合はdescription等で代用を要検討
                        era: row.era || '',
                        age: row.age || '',
                        minerals: row.minerals || '',
                        features: row.description || '',
                        story: row.story || '',
                        trivia: row.trivia || '',
                        images: imagesArr
                    };
                });
            }
            renderCabinet();
        }

        // ==========================================
        // VIEW: CABINET
        // ==========================================
        function renderCabinet() {
            const container = document.getElementById('view-cabinet');
            container.innerHTML = '';

            DRAWERS.forEach((drawer, index) => {
                const count = stones.filter(s => s.category === drawer.id).length;
                
                const html = `
                    <div onclick="openDrawer('${drawer.id}')" class="drawer-front rounded-lg p-3.5 cursor-pointer flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <div class="brass-plate w-16 py-1.5 rounded flex flex-col items-center justify-center">
                                <span class="text-[8px] text-[#4a3614] font-['Cinzel'] font-bold uppercase tracking-wider">Drawer</span>
                                <span class="text-sm text-[#2a1e08] font-serif font-black">0${index + 1}</span>
                            </div>
                            <div>
                                <h3 class="text-[#eaddc6] text-lg font-bold tracking-widest">${drawer.label}</h3>
                                <p class="text-[9px] text-[#8c6f50] font-['Cinzel'] tracking-widest uppercase">${drawer.subtitle}</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-center justify-center space-y-1">
                            <div class="w-12 h-2 brass-plate rounded-full"></div>
                            <div class="w-10 h-6 border-2 border-[#b58f3f] rounded-b-full flex items-center justify-center shadow-md bg-[#2a1e08]">
                                <div class="text-[9px] text-[#e5cc8f] font-bold">${count}</div>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        // ==========================================
        // VIEW: DRAWER (Grid)
        // ==========================================
        function openDrawer(categoryId) {
            activeDrawerId = categoryId;
            activeDrawerStones = stones.filter(s => s.category === categoryId);
            
            document.getElementById('drawer-title').textContent = categoryId;
            const grid = document.getElementById('drawer-grid');
            grid.innerHTML = '';

            if (activeDrawerStones.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center text-[#5c8a6b] text-xs py-10">標本がありません<br><br><button onclick="openModal()" class="text-[#e1ecd6] underline">新しく登録する</button></div>`;
            } else {
                activeDrawerStones.forEach((stone, index) => {
                    const thumbUrl = stone.images.length > 0 ? stone.images[0].url : 'https://placehold.co/200x200/1f1209/e5cc8f?text=No+Image';

                    const html = `
                        <div onclick="openCard(${index})" class="flex flex-col items-center cursor-pointer group">
                            <div class="w-full aspect-square bg-[#082012] rounded-lg p-2 shadow-[inset_0_4px_10px_rgba(0,0,0,0.8),0_2px_4px_rgba(255,255,255,0.05)] border border-[#143d24] flex items-center justify-center group-active:scale-95 transition-transform">
                                <div class="w-full h-full rounded overflow-hidden shadow-md bg-[#1a100a]">
                                    <img src="${thumbUrl}" alt="${stone.name}" class="w-full h-full object-cover">
                                </div>
                            </div>
                            <div class="mt-2 brass-plate px-2 py-0.5 rounded text-center w-11/12 shadow-lg relative">
                                <div class="absolute -left-1 top-1/2 -translate-y-1/2 w-1.5 h-1.5 rounded-full bg-[#3a2512] shadow-inner"></div>
                                <div class="absolute -right-1 top-1/2 -translate-y-1/2 w-1.5 h-1.5 rounded-full bg-[#3a2512] shadow-inner"></div>
                                <span class="text-[9px] font-bold text-[#3d2910] truncate block">${stone.name}</span>
                            </div>
                        </div>
                    `;
                    grid.insertAdjacentHTML('beforeend', html);
                });
            }

            document.getElementById('view-drawer').classList.remove('hidden');
        }

        function closeDrawer() {
            document.getElementById('view-drawer').classList.add('hidden');
            activeDrawerId = null;
            renderCabinet();
        }

        // ==========================================
        // VIEW: CARD (Swiper)
        // ==========================================
        function openCard(startIndex) {
            document.getElementById('view-card').classList.remove('hidden');
            renderSwiperCards();

            if (swiperInstance) swiperInstance.destroy();
            swiperInstance = new Swiper('.card-swiper', {
                initialSlide: startIndex,
                spaceBetween: 20,
                speed: 300,
                on: { slideChange: updatePagination }
            });
            updatePagination();
        }

        function closeCard() {
            document.getElementById('view-card').classList.add('hidden');
        }

        function updatePagination() {
            if(!swiperInstance) return;
            const current = swiperInstance.activeIndex + 1;
            const total = activeDrawerStones.length;
            document.querySelector('.swiper-pagination-custom').textContent = `${current} / ${total}`;
        }

        function renderSwiperCards() {
            const wrapper = document.getElementById('card-wrapper');
            wrapper.innerHTML = '';

            activeDrawerStones.forEach((stone) => {
                const defaultImg = stone.images.length > 0 ? stone.images[0] : { url: 'https://placehold.co/800x600/e0d6c5/8c6b42?text=No+Image', type: 'dry' };

                let pillsHtml = '';
                if (stone.images.length > 0) {
                    stone.images.forEach((img, idx) => {
                        const typeInfo = IMG_TYPES[img.type] || { icon: 'fa-camera', label: '写真' };
                        const activeClass = idx === 0 ? 'active' : 'bg-[#e5dcc6] text-[#63503a] border-[#c0b098]';
                        pillsHtml += `
                            <button onclick="switchImage('${stone.id}', '${img.url}', this)" 
                                    class="state-pill shrink-0 flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-[10px] font-bold border shadow-sm ${activeClass}">
                                <i class="fa-solid ${typeInfo.icon}"></i>
                                <span>${typeInfo.label}</span>
                            </button>
                        `;
                    });
                }

                const tr = (label, val) => val ? `<div class="flex"><div class="w-1/3 p-2 text-[#7a644e] bg-[#ede5d6]/50">${label}</div><div class="w-2/3 p-2 font-semibold">${val}</div></div>` : '';
                const textSection = (icon, title, content) => content ? `
                    <div>
                        <h4 class="text-xs font-bold text-[#684c2a] mb-1.5 flex items-center space-x-1.5 border-b border-[#dfd1b8] pb-1">
                            <i class="fa-solid ${icon}"></i><span>${title}</span>
                        </h4>
                        <p class="text-[11px] leading-relaxed pl-1 whitespace-pre-wrap">${content}</p>
                    </div>` : '';

                const storySection = content => content ? `
                    <div>
                        <h4 class="text-xs font-bold text-[#684c2a] mb-2 flex items-center space-x-1.5">
                            <i class="fa-solid fa-map"></i><span>成因・地質ストーリー</span>
                        </h4>
                        <div class="story-quote p-3.5 rounded-sm text-[11px] leading-loose shadow-inner relative">
                            <i class="fa-solid fa-quote-left absolute top-2 left-2 text-2xl text-[#c4b192] opacity-40"></i>
                            <p class="relative z-10 px-1 indent-2 whitespace-pre-wrap">${content}</p>
                        </div>
                    </div>` : '';

                const html = `
                    <div class="swiper-slide overflow-y-auto no-scrollbar px-4 pt-5 pb-12" id="slide-${stone.id}">
                        <div class="max-w-md mx-auto space-y-6 relative">
                            
                            <button onclick="openModal('${stone.id}')" class="absolute top-0 right-0 w-8 h-8 flex items-center justify-center text-[#8c6b42] hover:text-[#5c4515] bg-[#ece3d1] rounded-full shadow-sm border border-[#cfc0a9]">
                                <i class="fa-solid fa-pen"></i>
                            </button>

                            <div class="text-center space-y-1 pr-10">
                                <h2 class="text-2xl font-bold text-[#2a1a0c] tracking-widest">${stone.name}</h2>
                                <p class="text-xs font-bold text-[#8c6b42] border border-[#cfc0a9] inline-block px-2 py-0.5 rounded-sm bg-[#ece3d1]">${stone.category}</p>
                            </div>

                            <div class="space-y-3">
                                <div class="bg-white p-2 rounded-sm border border-[#cfc0a9] shadow-[0_2px_8px_rgba(0,0,0,0.1)] relative">
                                    <div class="w-full aspect-video rounded-sm overflow-hidden bg-[#e0d6c5]">
                                        <img id="img-${stone.id}" src="${defaultImg.url}" class="w-full h-full object-cover img-crossfade">
                                    </div>
                                </div>
                                <div class="flex overflow-x-auto no-scrollbar space-x-2 py-1 justify-center">
                                    ${pillsHtml}
                                </div>
                            </div>

                            <div class="bg-[#faf5ec]/60 border border-[#d6c9b3] rounded-sm text-[11px] divide-y divide-[#e3d7c2] shadow-sm">
                                ${tr('採取地', stone.location)}
                                ${tr('地質帯/構造帯', stone.geologicalBand)}
                                ${tr('形成年代', stone.era + (stone.age ? ` <span class="text-[#9a8670] font-normal text-[10px]">(${stone.age})</span>` : ''))}
                                ${tr('構成鉱物', stone.minerals)}
                            </div>

                            <div class="space-y-5 text-[#3b2b1e]">
                                ${textSection('fa-magnifying-glass', '特徴と見分け方', stone.features)}
                                ${storySection(stone.story)}
                                ${textSection('fa-regular fa-comment-dots', '豆知識・コラム', stone.trivia)}
                            </div>
                        </div>
                    </div>
                `;
                wrapper.insertAdjacentHTML('beforeend', html);
            });
        }

        function switchImage(stoneId, newSrc, pillElement) {
            const imgEl = document.getElementById(`img-${stoneId}`);
            if (!imgEl) return;

            imgEl.style.opacity = '0.3';
            setTimeout(() => {
                imgEl.src = newSrc;
                imgEl.style.opacity = '1';
            }, 150);

            const slide = document.getElementById(`slide-${stoneId}`);
            const allPills = slide.querySelectorAll('.state-pill');
            allPills.forEach(p => {
                p.classList.remove('active', 'bg-[#2b4535]', 'text-[#dceddf]', 'border-[#1e3325]');
                p.classList.add('bg-[#e5dcc6]', 'text-[#63503a]', 'border-[#c0b098]');
            });
            pillElement.classList.remove('bg-[#e5dcc6]', 'text-[#63503a]', 'border-[#c0b098]');
            pillElement.classList.add('active');
        }

        // ==========================================
        // IMAGE COMPRESSION & UPLOAD
        // ==========================================
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1200;
                        let scaleSize = 1;
                        if(img.width > MAX_WIDTH) {
                            scaleSize = MAX_WIDTH / img.width;
                        }
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.8);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function uploadFile(file) {
            if (!file) return null;
            const compressedBlob = await compressImage(file);
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.jpg`;
            const { data, error } = await supabase.storage
                .from('mineral-images')
                .upload(fileName, compressedBlob, { contentType: 'image/jpeg' });

            if (error) {
                console.error("画像のアップロードエラー:", error);
                return null;
            }
            const { data: publicUrlData } = supabase.storage.from('mineral-images').getPublicUrl(fileName);
            return publicUrlData.publicUrl;
        }

        // ==========================================
        // MODAL (ADD / EDIT)
        // ==========================================
        function openModal(stoneId = null) {
            const modal = document.getElementById('modal-form');
            const form = document.getElementById('stone-form');
            const title = document.getElementById('modal-title');
            const deleteBtn = document.getElementById('btn-delete');
            
            form.reset();
            document.getElementById('ai-text').value = '';
            
            // 既存画像のリセット
            ['dry', 'wet', 'light'].forEach(t => document.getElementById(`existing-img-${t}`).value = '');

            if (stoneId) {
                // EDIT MODE
                title.textContent = '標本データの編集';
                deleteBtn.classList.remove('hidden');
                
                const stone = stones.find(s => s.id === stoneId);
                document.getElementById('form-id').value = stone.id;
                document.getElementById('form-name').value = stone.name || '';
                document.getElementById('form-category').value = stone.category || '鑑定中';
                document.getElementById('form-location').value = stone.location || '';
                document.getElementById('form-band').value = stone.geologicalBand || '';
                document.getElementById('form-era').value = stone.era || '';
                document.getElementById('form-age').value = stone.age || '';
                document.getElementById('form-minerals').value = stone.minerals || '';
                document.getElementById('form-features').value = stone.features || '';
                document.getElementById('form-story').value = stone.story || '';
                document.getElementById('form-trivia').value = stone.trivia || '';

                // 編集時は既存の画像URLを隠しフィールドに保持しておく
                stone.images.forEach(img => {
                    const hiddenInput = document.getElementById(`existing-img-${img.type}`);
                    if(hiddenInput) hiddenInput.value = img.url;
                });
            } else {
                // ADD MODE
                title.textContent = '新規標本登録';
                deleteBtn.classList.add('hidden');
                document.getElementById('form-id').value = '';
                if(activeDrawerId) document.getElementById('form-category').value = activeDrawerId;
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-form').classList.add('hidden');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('btn-submit');
            submitBtn.innerText = '保存中...';
            submitBtn.disabled = true;

            const id = document.getElementById('form-id').value; // 空なら新規
            
            // 画像のアップロード処理 (ファイルが選択されていればアップロード、なければ既存URLを使用)
            const images = [];
            const types = ['dry', 'wet', 'light'];
            
            for (const type of types) {
                const fileInput = document.getElementById(`img-file-${type}`);
                const existingUrl = document.getElementById(`existing-img-${type}`).value;
                
                if (fileInput.files.length > 0) {
                    const newUrl = await uploadFile(fileInput.files[0]);
                    if (newUrl) images.push({ url: newUrl, type: type });
                } else if (existingUrl) {
                    images.push({ url: existingUrl, type: type });
                }
            }

            const stoneData = {
                name: document.getElementById('form-name').value.trim(),
                category: document.getElementById('form-category').value,
                location: document.getElementById('form-location').value.trim(),
                description: document.getElementById('form-features').value.trim(),
                story: document.getElementById('form-story').value.trim(),
                // カラムにない項目は今回は使用しない、あるいは別の用途で使うかテーブル定義を増やす必要があります
                // ※以下の項目はデータベースにカラムを追加していない場合、保存時にエラーになる可能性があります。
                // そのため、今回はJSON化して画像とまとめるか、必要なものだけ送ります。
                image_url: JSON.stringify(images) // 画像配列をJSONテキストとして保存
            };

            if (id) {
                // UPDATE
                const { error } = await supabase.from('minerals').update(stoneData).eq('id', id);
                if (error) alert("更新に失敗しました: " + error.message);
            } else {
                // INSERT
                const { error } = await supabase.from('minerals').insert([stoneData]);
                if (error) alert("登録に失敗しました: " + error.message);
            }

            submitBtn.innerText = '保存する';
            submitBtn.disabled = false;
            closeModal();
            
            // データを再取得して画面更新
            await initData();
            
            // 開いていた引き出しを再表示
            if (activeDrawerId) {
                openDrawer(activeDrawerId);
                closeCard();
            }
        }

        async function deleteCurrentStone() {
            const id = document.getElementById('form-id').value;
            if(!id) return;

            if (confirm("この標本を削除してもよろしいですか？")) {
                const { error } = await supabase.from('minerals').delete().eq('id', id);
                if (error) {
                    alert("削除に失敗しました: " + error.message);
                } else {
                    closeModal();
                    closeCard();
                    await initData();
                    if(activeDrawerId) openDrawer(activeDrawerId);
                }
            }
        }

        // ==========================================
        // AI TEXT PARSING LOGIC
        // ==========================================
        function parseAIText() {
            const text = document.getElementById('ai-text').value;
            if(!text) return;

            const lines = text.split('\n');
            lines.forEach(line => {
                const parts = line.split(/[:：]/);
                if (parts.length < 2) return;
                
                const key = parts[0].trim();
                const value = parts.slice(1).join(':').trim();

                if(key.includes('名前') || key.includes('名称')) setVal('form-name', value);
                else if(key.includes('分類') || key.includes('グループ')) {
                    const catSelect = document.getElementById('form-category');
                    if(value.includes('火成')) catSelect.value = '火成岩';
                    else if(value.includes('堆積')) catSelect.value = '堆積岩';
                    else if(value.includes('変成')) catSelect.value = '変成岩';
                }
                else if(key.includes('採取') || key.includes('場所')) setVal('form-location', value);
                else if(key.includes('地質帯') || key.includes('構造帯')) setVal('form-band', value);
                else if(key.includes('形成年代') || key.includes('時代')) setVal('form-era', value);
                else if(key.includes('数値年代') || key.includes('億年前') || key.includes('万年前')) setVal('form-age', value);
                else if(key.includes('鉱物') || key.includes('成分')) setVal('form-minerals', value);
                else if(key.includes('特徴') || key.includes('見分け')) setVal('form-features', value);
                else if(key.includes('成因') || key.includes('ストーリー')) setVal('form-story', value);
                else if(key.includes('豆知識') || key.includes('コラム') || key.includes('トリビア')) setVal('form-trivia', value);
            });
        }

        function setVal(id, val) {
            const el = document.getElementById(id);
            if(el && !el.value) el.value = val;
        }

        // Bootstrap
        document.addEventListener('DOMContentLoaded', initData);

    </script>

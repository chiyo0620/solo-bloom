<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Mineral Cabinet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #f4eee1; font-family: 'Helvetica Neue', Arial, sans-serif; }
    .cabinet { background: #5c4033; border: 4px solid #3e2723; border-radius: 8px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .drawer { background: #8d6e63; border: 2px solid #4e342e; border-radius: 4px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); transition: transform 0.2s; }
    .drawer:active { transform: scale(0.98); }
    .drawer-label { background: #d7ccc8; color: #3e2723; border: 1px solid #795548; font-weight: bold; }
    .mineral-card { background: #fffdf7; border: 1px solid #d7ccc8; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

  <h1 class="text-2xl font-bold text-stone-800 mb-6 tracking-widest">Pocket Mineral Cabinet</h1>

  <!-- 標本タンス (Drawers) -->
  <div class="cabinet w-full max-w-md flex flex-col gap-4 mb-8">
    <button onclick="openDrawer('火成岩')" class="drawer p-4 flex justify-center items-center h-20">
      <div class="drawer-label px-4 py-1 rounded shadow-sm text-sm">火成岩 (Igneous)</div>
    </button>
    <button onclick="openDrawer('堆積岩')" class="drawer p-4 flex justify-center items-center h-20">
      <div class="drawer-label px-4 py-1 rounded shadow-sm text-sm">堆積岩 (Sedimentary)</div>
    </button>
    <button onclick="openDrawer('変成岩')" class="drawer p-4 flex justify-center items-center h-20">
      <div class="drawer-label px-4 py-1 rounded shadow-sm text-sm">変成岩 (Metamorphic)</div>
    </button>
    <button onclick="openDrawer('鑑定中')" class="drawer p-4 flex justify-center items-center h-20">
      <div class="drawer-label px-4 py-1 rounded shadow-sm text-sm">鑑定中 (Unidentified)</div>
    </button>
  </div>

  <button onclick="openAddModal()" class="bg-stone-700 text-white px-6 py-3 rounded-full font-bold shadow-lg hover:bg-stone-600 transition-colors">
    + 新しい石を標本箱に入れる
  </button>

  <!-- ギャラリー表示エリア -->
  <div id="gallery-container" class="w-full max-w-md mt-8 hidden">
    <div class="flex justify-between items-center mb-4">
      <h2 id="gallery-title" class="text-xl font-bold text-stone-800 border-b-2 border-stone-800 pb-1"></h2>
      <button onclick="closeDrawer()" class="text-stone-500 hover:text-stone-800 font-bold">閉じる</button>
    </div>
    <div id="mineral-list" class="grid grid-cols-1 gap-6"></div>
  </div>

  <!-- 登録・編集モーダル -->
  <div id="add-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex justify-center items-center p-4 z-50 overflow-y-auto">
    <div class="bg-white rounded-lg p-6 w-full max-w-md mt-20 mb-10">
      <h2 class="text-xl font-bold mb-4 text-stone-800 border-b-2 border-stone-200 pb-2">標本の登録・編集</h2>
      
      <!-- Geminiペーストエリア -->
      <div class="mb-6 p-4 bg-stone-100 rounded border border-stone-300">
        <label class="block text-xs font-bold text-stone-600 mb-2">Geminiの解析結果をペースト (自動入力)</label>
        <textarea id="ai-paste" rows="3" class="w-full border rounded p-2 text-sm" placeholder="石の名前：翡翠&#10;分類：変成岩..."></textarea>
        <button type="button" onclick="parseAiText()" class="mt-2 bg-stone-500 text-white px-3 py-1 rounded text-xs">項目に反映</button>
      </div>

      <form id="mineral-form" class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-stone-700">写真 (自動圧縮されます)</label>
          <input type="file" id="image-input" accept="image/*" class="w-full text-sm mt-1">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-bold text-stone-700">石の名前</label>
            <input type="text" id="name" required class="w-full border rounded p-2 mt-1">
          </div>
          <div>
            <label class="block text-sm font-bold text-stone-700">分類</label>
            <select id="category" class="w-full border rounded p-2 mt-1">
              <option value="火成岩">火成岩</option>
              <option value="堆積岩">堆積岩</option>
              <option value="変成岩">変成岩</option>
              <option value="鑑定中">鑑定中</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-bold text-stone-700">採取地・地質帯</label>
          <input type="text" id="location" class="w-full border rounded p-2 mt-1">
        </div>
        <div>
          <label class="block text-sm font-bold text-stone-700">特徴と見分け方</label>
          <textarea id="description" rows="2" class="w-full border rounded p-2 mt-1"></textarea>
        </div>
        <div>
          <label class="block text-sm font-bold text-stone-700">成因・ストーリー</label>
          <textarea id="story" rows="2" class="w-full border rounded p-2 mt-1 text-sm bg-stone-50"></textarea>
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t border-stone-200">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-stone-500 font-bold">キャンセル</button>
          <button type="submit" id="submit-btn" class="bg-stone-800 text-white px-6 py-2 rounded font-bold">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. Supabaseの初期設定 (必ず自分のものに書き換えてください！)
    // ==========================================
    const SUPABASE_URL = 'https://mlyqkgnpugvplywdxfnx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1seXFrZ25wdWd2cGx5d2R4Zm54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NDg0NjYsImV4cCI6MjEwODMyNDQ2Nn0.0Gt28lq7-DcOgcvNSHzFUxhM24H0EHJz0ff57eXfCg4';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentDrawerView = '';

    // ==========================================
    // 2. データベース操作
    // ==========================================
    async function loadMinerals(category) {
      const { data, error } = await supabase
        .from('minerals')
        .select('*')
        .eq('category', category)
        .order('created_at', { ascending: false });

      if (error) {
        alert('データの読み込みに失敗しました');
        return;
      }
      renderGallery(data);
    }

    document.getElementById('mineral-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.innerText = '保存中...';
      submitBtn.disabled = true;

      const name = document.getElementById('name').value;
      const category = document.getElementById('category').value;
      const location = document.getElementById('location').value;
      const description = document.getElementById('description').value;
      const story = document.getElementById('story').value;
      let imageUrl = '';

      // 画像があれば圧縮してアップロード
      const fileInput = document.getElementById('image-input');
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const compressedBlob = await compressImage(file);
        
        // ランダムなファイル名を生成してStorageへ保存
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.jpg`;
        const { data: uploadData, error: uploadError } = await supabase.storage
          .from('mineral-images')
          .upload(fileName, compressedBlob, { contentType: 'image/jpeg' });

        if (uploadError) {
          alert('画像の保存に失敗しました');
          submitBtn.innerText = '保存する';
          submitBtn.disabled = false;
          return;
        }
        // 公開URLを取得
        const { data: publicUrlData } = supabase.storage.from('mineral-images').getPublicUrl(fileName);
        imageUrl = publicUrlData.publicUrl;
      }

      // データベースに情報を登録
      const { error: dbError } = await supabase
        .from('minerals')
        .insert([{ name, category, location, description, story, image_url: imageUrl }]);

      if (dbError) {
        alert('データの保存に失敗しました');
      } else {
        closeAddModal();
        if (currentDrawerView === category) {
          loadMinerals(category); // 開いている引き出しと同じ分類なら再読み込み
        }
      }

      submitBtn.innerText = '保存する';
      submitBtn.disabled = false;
    });

    // ==========================================
    // 3. UI・ギャラリー描画
    // ==========================================
    function openDrawer(category) {
      currentDrawerView = category;
      document.getElementById('gallery-title').innerText = `${category} の引き出し`;
      document.getElementById('gallery-container').classList.remove('hidden');
      document.getElementById('mineral-list').innerHTML = '<p class="text-center text-stone-500 py-8">読み込み中...</p>';
      loadMinerals(category);
    }

    function closeDrawer() {
      document.getElementById('gallery-container').classList.add('hidden');
      currentDrawerView = '';
    }

    function renderGallery(minerals) {
      const container = document.getElementById('mineral-list');
      container.innerHTML = '';

      if (minerals.length === 0) {
        container.innerHTML = '<p class="text-center text-stone-500 py-8">この引き出しは空です。</p>';
        return;
      }

      minerals.forEach(m => {
        const card = document.createElement('div');
        card.className = 'mineral-card rounded-lg overflow-hidden flex flex-col';
        card.innerHTML = `
          ${m.image_url ? `<img src="${m.image_url}" class="w-full h-48 object-cover border-b border-stone-200">` : `<div class="w-full h-32 bg-stone-200 flex items-center justify-center text-stone-400 text-sm border-b border-stone-200">No Image</div>`}
          <div class="p-4 flex-grow flex flex-col gap-2">
            <div class="flex justify-between items-start">
              <h3 class="text-lg font-bold text-stone-800">${m.name}</h3>
              <span class="text-xs bg-stone-200 text-stone-600 px-2 py-1 rounded">${m.category}</span>
            </div>
            ${m.location ? `<p class="text-xs text-stone-500 font-bold border-b border-stone-100 pb-1">📍 ${m.location}</p>` : ''}
            <p class="text-sm text-stone-700 mt-1">${m.description}</p>
            ${m.story ? `
              <blockquote class="text-sm text-stone-600 italic bg-stone-50 p-2 border-l-4 border-stone-400 rounded mt-2">
                ${m.story}
              </blockquote>
            ` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ==========================================
    // 4. 便利機能 (画像圧縮 & AIテキスト抽出)
    // ==========================================
    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1200; // スマホ表示に十分なサイズ
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.8);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function parseAiText() {
      const text = document.getElementById('ai-paste').value;
      // 簡易的なパース処理 (Geminiの出力フォーマットに合わせて調整可能)
      const extract = (label) => {
        const regex = new RegExp(`(?:${label}[:：]\\s*)([^\\n]+)`);
        const match = text.match(regex);
        return match ? match[1].trim() : '';
      };
      
      const name = extract('石の名前') || extract('名前');
      if (name) document.getElementById('name').value = name;
      
      const cat = extract('分類');
      if (cat) {
        const select = document.getElementById('category');
        for (let i = 0; i < select.options.length; i++) {
          if (select.options[i].value === cat) select.selectedIndex = i;
        }
      }
      
      const loc = extract('採取地') || extract('地質帯');
      if (loc) document.getElementById('location').value = loc;
    }

    function openAddModal() {
      document.getElementById('mineral-form').reset();
      document.getElementById('ai-paste').value = '';
      document.getElementById('add-modal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
